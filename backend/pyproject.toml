[project]
name = "vault-backend"
version = "0.1.0"
description = "Vault de Senhas — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "pyjwt>=2.10",
    "pyotp>=2.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# boto3 e opcional: so quem usa o AWS KMS como provedor de chave precisa dele.
# Quem roda local com LocalKeyProvider nao instala, e o import e tardio para
# que a ausencia nao quebre nada.
kms = [
    "boto3>=1.35",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
