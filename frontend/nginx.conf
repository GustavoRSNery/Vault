server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança. Num cofre de senhas eles valem mais do que o
    # normal: a CSP abaixo bloqueia script de outra origem, que é o vetor do
    # XSS capaz de ler os tokens que o front guarda em memória.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # A API vive atrás do mesmo host: o navegador nunca fala com outra origem,
    # então não há CORS nem URL de backend embutida no bundle.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # A aplicação lê este cabeçalho para registrar o IP na auditoria.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /saude {
        proxy_pass http://api:8000/saude;
        proxy_set_header Host $host;
    }

    # Os arquivos com hash no nome podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota desconhecida devolve o index, e o React roteia.
    # Sem isto, recarregar em /cofres/contabil daria 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
